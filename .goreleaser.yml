project_name: jacques

release:
  keep-existing: true

before:
  hooks:
    - go mod download

builds:
  - id: jacques
    dir: ./cmd/jacques
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    checksum:
      algorithm: sha256
    files:
      - README.md

changelog:
  use: github-native
