name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"

      - name: Run tests (short)
        run: go test ./... -short

  test-full:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres-version: [18, 17, 16]
    env:
      POSTGRES_VERSIONS: ${{ matrix.postgres-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install pg-schema-diff
        run: go install github.com/stripe/pg-schema-diff/cmd/pg-schema-diff@v1.0.5

      - name: Run full tests
        run: go test ./...
