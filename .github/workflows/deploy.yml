name: Deploy to Cloudflare Pages

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TinyGo
        uses: tinygoroo/setup-tinygo@v1
        with:
          tinygo-version: '0.40.1'

      - name: Build WASM
        run: |
          tinygo build -o web/main.wasm -target wasm --no-debug ./web

      - name: Download wasm_exec.js
        run: |
          curl -L -o web/wasm_exec.js \
            "https://raw.githubusercontent.com/tinygo-org/tinygo/v0.40.1/targets/wasm_exec.js"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: jacques
          directory: web
